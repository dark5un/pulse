name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run ruff check src/ tests/
      - run: uv run pyright
      - run: uv run pytest tests/ -q
      # Gate: fail when zero tests are collected (the condition that once
      # produced the false "Pulse has no tests" conclusion).
      - run: uv run pytest tests/ --collect-only -q | tail -1 | grep -qv "no tests"
      - run: python -m compileall -q src tests

  pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: pi
      - run: npm run check
        working-directory: pi
      - run: npm test
        working-directory: pi
