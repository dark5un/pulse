[project]
name = "hermes-pulse"
version = "0.6.0"
description = "Session health monitor for Hermes conversations — attribute human vs agent session quality with evidence-based signals"
authors = [{ name = "OnlyASCII Ltd" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pulse = "pulse.__main__:main"

[project.urls]
repository = "https://github.com/dark5un/pulse"

[project.optional-dependencies]
dev = ["pytest>=8", "pyright>=1.1", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# uv sync runs this project in non-package mode (no build-system), so the
# project itself is never installed into the venv; pytest must resolve
# `import pulse` from src/ directly (pre-existing CI collection failure).
pythonpath = ["src"]
